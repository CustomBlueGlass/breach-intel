name: Ingest breach sources (twice daily, UK time)

on:
  schedule:
    # 04:00 and 16:00 UK local time (Europe/London), DST-aware. GitHub cron is
    # UTC-only and cannot follow the BST/GMT switch, so we fire at both candidate
    # UTC hours and let the `gate` job below keep only the firings that are 04:00
    # or 16:00 in London. 04:00 UK == 04:00 UTC (GMT) or 03:00 UTC (BST); 16:00 UK
    # == 16:00 UTC (GMT) or 15:00 UTC (BST). Net effect: exactly two ingests a day
    # at 04:00 and 16:00 London time, which keeps Actions minutes well within the
    # free private-repo budget.
    - cron: '0 3,4,15,16 * * *'
  workflow_dispatch: {}

jobs:
  # Cheap timezone gate (~seconds, ~1 billed minute). Runs on every firing and
  # decides whether the real ingest should proceed, so the two off-DST firings a
  # day are skipped (a skipped job costs no minutes). Manual runs always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Manual run ($EVENT): proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=$(TZ='Europe/London' date +%H)
          if [ "$H" = "04" ] || [ "$H" = "16" ]; then
            echo "London local hour is $H: proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "London local hour is $H (not 04 or 16): skipping this firing."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A first-time pull from a bulk source (e.g. HIBP's ~800 breaches, or a
    # raised California OAG cap) runs every newly exposed record through
    # candidate correlation and needs well over 20 minutes; steady-state runs
    # dedup those records in seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # This job only reads the repo (no pushes), so don't leave the
          # GITHUB_TOKEN persisted in .git/config where a later compromised
          # step could reuse it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Database maintenance (idempotent cleanup + view healing)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.maintenance

      - name: Run all collectors
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAKIX_API_KEY: ${{ secrets.LEAKIX_API_KEY }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
        run: python -m app.scheduler

      - name: Refresh threat-radar ticker (latest ransomware victims + CISA KEV)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional — the ticker adds OTX pulses / URLhaus rows only when
          # these free-tier keys are present; otherwise it runs keyless.
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: python -m app.threat_radar
