name: CI

# Deterministic quality gate for every PR (and pushes to main): install from
# the lockfile, statically check the serverless functions, build the frontend,
# run the automated tests, and compile-check the Python backend. Any failure
# blocks the change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (from lockfile)
        run: npm ci
      - name: Static-check serverless functions
        run: npm run check:functions
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  backend:
    name: Backend static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check the Python sources
        run: python -m compileall -q backend/app
